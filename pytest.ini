[tool:pytest]
# Pytest configuration for workspace-level integration tests

# Python path configuration - add workspace root and packages directory
pythonpath = . packages

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes
    --asyncio-mode=auto

# Markers for test categorization
markers =
    integration: Integration tests that require multiple services
    database: Tests that require database connectivity
    external: Tests that require external service dependencies
    slow: Tests that take longer than 5 seconds
    unit: Unit tests for individual components
    smoke: Smoke tests for basic functionality
    health: Health check related tests
    startup: Service startup/shutdown tests
    config: Configuration validation tests
    cross_service: Tests that span multiple services

# Async configuration
asyncio_mode = auto

# Test timeout (in seconds)
timeout = 300

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:testcontainers.*

# Coverage configuration (if using pytest-cov)
# addopts = --cov=packages --cov=apps --cov-report=html --cov-report=term-missing

# Environment variables for tests
env =
    ENVIRONMENT = testing
    DATABASE_URL = mysql://test:test@localhost:3306/test_db
    JWT_SECRET_KEY = test-jwt-secret-key-for-integration-tests-only
    LLM_OPENAI_API_KEY = test-openai-key
    VECTOR_PINECONE_API_KEY = test-pinecone-key
    VECTOR_PINECONE_ENVIRONMENT = test-environment
    DEBUG = false
    LOG_LEVEL = INFO

# Test collection configuration
collect_ignore =
    setup.py
    conftest.py
    migrations/
    alembic/
    .venv/
    .venv-dev/
    __pycache__/
    node_modules/
    .git/

# Disable cacheprovider for integration tests to ensure fresh state
cache_dir = /tmp/pytest_cache

# Test execution configuration
# Run tests in parallel (requires pytest-xdist)
# addopts = -n auto

# Test reporting
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true

# Custom test collection patterns
# Collect integration tests separately
# python_files = test_*.py *_test.py integration_test_*.py

# Test isolation - each test gets fresh database
# addopts = --forked  # requires pytest-forked for process isolation
