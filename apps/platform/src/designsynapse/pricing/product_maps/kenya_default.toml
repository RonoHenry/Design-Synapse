# Kenya default product map: the supplier products accepted for each material
# in the Kenya default rate table.
#
# STATUS: UNVERIFIED. Products were matched from their catalogue listings in
# November 2026. A quantity surveyor must confirm that each product meets the
# material's specification before prices are shown to customers.
#
# Each entry names a product by `store` and `product_id`, the keys used in the
# apps/price-scraper CSV. `pack` is the quantity of the material, in its
# rate-table unit, that one product supplies.
#
# When several products are accepted for a material, the one with the lowest
# price per material unit is used. In-stock products are preferred, and ties
# go to the product listed first.
#
# Map only single-price listings. For a product sold in several sizes, the
# collected price is the price of the cheapest size, so the pack is unknown.
#
# Materials not mapped here are reported as unpriced. Known gaps as of
# November 2026:
# - Sand, ballast, hardcore, murram, machine-cut stone, reinforcement bars,
#   binding wire, timber, trusses and roofing sheets: not sold by the
#   registered suppliers.
# - Polythene DPM 1000 gauge: listed by gypsumceilingkenya (8534, 8537), but
#   the roll size is not published.
# - Vinyl silk emulsion: listed in 1, 4 and 20 L sizes under one product, so
#   only the cheapest size's price is collected.
# - Termiticide, weatherproof paint, roofing nails, ridge cap, ceramic floor
#   tiles, tile adhesive and tile skirting: no matching product listed.

[meta]
name = "Kenya default"
region = "KE"
currency = "KES"
verified = false

# ------------------------------------------------------------------ cement
# Portland cement 32.5N, 50 kg bag. Bamburi Fundi (ebuild 26799) is excluded:
# its listing gives it as 22.5N, below the specified strength class. The
# gypsumceilingkenya Bamburi listing (8507) is excluded because it covers
# four products under one price.

[[materials.cement]]  # Bamburi Tembo 50 kg, general purpose
store = "ebuild"
product_id = 24938
pack = 1

[[materials.cement]]  # Bamburi Nguvu 50 kg, structural grade
store = "ebuild"
product_id = 24936
pack = 1

