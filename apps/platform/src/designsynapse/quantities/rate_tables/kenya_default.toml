unit = "m2"
# Side and end laps: about 15% more sheet than roof area.
materials = { roofing_sheet_g30 = 1.15, roofing_nails = 0.05 }

[specs.ridge_cap]
description = "Gauge 30 ridge and hip capping"
unit = "m"
