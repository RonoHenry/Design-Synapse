# -------------------------------------------------------------------- specs

[specs.oversite_strip_150]
description = "Clear site and excavate oversite to remove topsoil average 150 mm deep"
unit = "m2"

[specs.excavate_trench]
description = "Excavate foundation trench not exceeding 1.5 m deep, in ordinary soil"
unit = "m3"

[specs.backfill_trench]
description = "Return, fill and ram selected excavated material around foundations"
unit = "m3"

[specs.concrete_c15]
description = "Plain concrete class 15 (1:3:6) in foundation footings"
unit = "m3"
materials = { cement = 4.4, sand = 0.74, ballast = 1.39 }

[specs.concrete_c20]
description = "Concrete class 20 (1:2:4)"
unit = "m3"
materials = { cement = 6.4, sand = 0.70, ballast = 1.32 }

[specs.mcs_200]
description = "200 mm machine-cut natural stone walling in cement-sand (1:4) mortar"
unit = "m2"
materials = { stone_mcs = 12.5, cement = 0.19, sand = 0.043 }

[specs.mcs_150]
description = "150 mm machine-cut natural stone walling in cement-sand (1:4) mortar"
unit = "m2"
materials = { stone_mcs_150 = 12.5, cement = 0.15, sand = 0.032 }

[specs.hardcore_200]
description = "200 mm thick approved hardcore filling, well compacted"
unit = "m2"
materials = { hardcore = 0.40 }

[specs.murram_blinding_50]
description = "50 mm thick murram blinding to hardcore"
unit = "m2"
materials = { murram = 0.10 }

[specs.anti_termite]
description = "Anti-termite treatment to surface of blinding"
unit = "m2"
materials = { termiticide = 0.05 }

[specs.dpm_1000g]
description = "1000 gauge polythene damp-proof membrane laid with 300 mm laps"
unit = "m2"
materials = { polythene_1000g = 1.10 }

[specs.brc_a142]
description = "BRC mesh reinforcement A142 in ground slab, 300 mm laps"
unit = "m2"
materials = { brc_a142 = 1.15 }

[specs.dpc_200]
description = "Bituminous felt damp-proof course, 200 mm wide, bedded in mortar"
unit = "m"
materials = { dpc_felt_200 = 1.0 }

[specs.dpc_150]
description = "Bituminous felt damp-proof course, 150 mm wide, bedded in mortar"
unit = "m"
materials = { dpc_felt_150 = 1.0 }

[specs.rebar_high_yield]
description = "High yield steel bar reinforcement to BS 4449"
unit = "kg"
# 1 / (12 m x 0.888 kg/m) bars per kg for Y12; other sizes need their own spec.
materials = { bar_y12 = 0.0938, binding_wire = 0.01 }

[specs.rebar_mild_steel]
description = "Mild steel bar reinforcement (links) to BS 4449"
unit = "kg"
# 1 / (12 m x 0.395 kg/m) bars per kg for R8.
materials = { bar_r8 = 0.211, binding_wire = 0.01 }

[specs.formwork_beam_sides]
description = "Sawn formwork to sides of ring beam"
unit = "m2"
materials = { formwork_timber = 3.0 }

[specs.roofing_g30]
