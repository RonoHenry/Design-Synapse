# Kenya default specifications and material constants.
#
# STATUS: UNVERIFIED. These are typical Kenyan specifications and textbook
# material constants, written as a starting point. A practising quantity
# surveyor must check every coefficient before BOQs are shown to customers.
#
# Specs: each BOQ item references a spec. `materials` gives the quantity of
# each material per one unit of the item, BEFORE wastage.
# Materials: `wastage` is a fraction added on top when ordering.
#
# Densities assumed: sand 1.6 t/m3, ballast 1.5 t/m3, hardcore 1.6 t/m3
# (loose, with 25% compaction allowance), murram 1.6 t/m3.
# Cement: 50 kg bag, 1440 kg/m3. Dry volume factor: concrete 1.54, mortar 1.33.

[meta]
name = "Kenya default"
region = "KE"
currency = "KES"
verified = false

[defaults]
footing_concrete = "concrete_c15"
slab_concrete = "concrete_c20"
ring_beam_concrete = "concrete_c20"
oversite = "oversite_strip_150"
excavation = "excavate_trench"
backfill = "backfill_trench"
hardcore = "hardcore_200"
blinding = "murram_blinding_50"
anti_termite = "anti_termite"
dpm = "dpm_1000g"
mesh = "brc_a142"
formwork = "formwork_beam_sides"
plaster = "plaster_internal_12"
render = "render_external_15"
screed = "screed_25"
ceiling = "ceiling_gypsum"
paint_internal = "paint_emulsion"
paint_external = "paint_weatherproof"
paint_ceiling = "paint_emulsion_ceiling"
roof_covering = "roofing_g30"
ridge = "ridge_cap"
fascia = "fascia_board"
barge = "barge_board"
truss = "timber_truss"
purlin = "purlin_50x75"
main_bar = "rebar_high_yield"
link_bar = "rebar_mild_steel"

# Walling and DPC specs chosen by wall thickness in millimetres.
[defaults.walling]
200 = "mcs_200"
150 = "mcs_150"

[defaults.dpc]
200 = "dpc_200"
150 = "dpc_150"

