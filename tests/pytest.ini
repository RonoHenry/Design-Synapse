[tool:pytest]
# Pytest configuration for workspace-level integration tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    database: marks tests that require database
    external: marks tests that require external services
    timeout: marks tests with custom timeout requirements

# Async test support
asyncio_mode = auto

# Test output configuration
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes
    --cov=tests
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Timeout configuration
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:testcontainers
    error::pytest.PytestUnraisableExceptionWarning

# Environment variables for testing
env =
    ENVIRONMENT = testing
    DB_HOST = localhost
    DB_PORT = 5432
    DB_USERNAME = test
    DB_PASSWORD = test
    JWT_SECRET_KEY = test-secret-key-for-integration-tests
    LLM_PROVIDER = mock
    VECTOR_PROVIDER = mock
